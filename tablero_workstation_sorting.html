<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workstation Sorting</title>
<style>
:root{
  --navy-900:#0b1b2b; --navy-800:#0e2236; --navy-700:#16324d; --navy-600:#1f4366;
  --gold-300:#e8cf8a; --gold-400:#d9b45a; --gold-500:#c8a03e; --gold-700:#8b6914;
  --ivory:#fbf8f1; --ivory-2:#f3eee2; --line:#e6dfcc;
  --ink:#10243a; --muted:#7a8696;
  --green:#1f9d57; --green-bg:#e6f6ec;
  --amber:#c28a00; --amber-bg:#fff4d6;
  --red:#d6453a; --red-bg:#fde8e6;
  --mont:"Montserrat","Inter","Segoe UI",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--navy-900);font-size:1rem}
body{
  height:100vh;overflow:hidden;padding:1.125rem;
  font-family:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
  background:
    radial-gradient(56.25rem 31.25rem at 90% -10%, rgba(200,160,62,.22), transparent 60%),
    radial-gradient(43.75rem 26.25rem at -10% 110%, rgba(31,67,102,.9), transparent 60%),
    linear-gradient(180deg,var(--navy-800),var(--navy-900));
}
.ws{
  height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);
  background:var(--ivory);border-radius:2.25rem;overflow:hidden;
  box-shadow:0 2.5rem 5.625rem -24px rgba(0,0,0,.7),0 0 0 0.125rem rgba(232,207,138,.35);
}

/* Encabezado */
.ws-header{display:flex;align-items:stretch;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy-700) 0%,var(--navy-800) 70%);border-bottom:0.375rem solid var(--gold-400)}
.ws-header::after{content:"";position:absolute;right:-50px;top:-120px;width:22.5rem;height:22.5rem;border-radius:50%;background:radial-gradient(circle,rgba(232,207,138,.25),transparent 70%);pointer-events:none}
.ws-brand{display:flex;align-items:center;gap:1.875rem;background:#fff;padding:1rem 2.625rem;border-right:0.375rem solid var(--gold-400);position:relative;z-index:1}
.ws-brand img{display:block;height:3.25rem;width:auto}
.ws-brand .sep{width:0.125rem;height:2.875rem;background:var(--line)}
.ws-titlebox{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem;position:relative;z-index:1;text-align:center}
.ws-title{font-family:var(--mont);font-size:2.5rem;font-weight:800;letter-spacing:0.15rem;color:#fff;text-transform:uppercase;white-space:nowrap}
.ws-dpo{align-self:center;margin:0 2.125rem 0 0.375rem;width:4.75rem;height:4.75rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 1.375rem var(--mont);letter-spacing:1px;color:var(--navy-900);background:linear-gradient(135deg,var(--gold-300),var(--gold-500));box-shadow:0 0.625rem 1.5rem -10px rgba(0,0,0,.7);position:relative;z-index:1}
.live{position:absolute;left:1.875rem;top:50%;margin-top:-7px;width:0.875rem;height:0.875rem;border-radius:50%;background:#6b7f95}
.live.on{background:#34d27b;animation:ping 2.4s infinite}
.live.off{background:#ef5350}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,210,123,.6)}70%{box-shadow:0 0 0 0.75rem rgba(52,210,123,0)}100%{box-shadow:0 0 0 0 rgba(52,210,123,0)}}

/* Columnas */
.main-grid{display:grid;grid-template-columns:32.5rem minmax(0,1fr);min-height:0}
.col{border-right:0.125rem solid var(--line);display:flex;flex-direction:column;background:var(--ivory);min-height:0;min-width:0}
.col:last-child{border-right:none}
.col-title,.action-title{flex:none;background:linear-gradient(135deg,var(--navy-700),var(--navy-800));color:var(--gold-300);font:700 1.312rem/1 var(--mont);padding:1.188rem 0.625rem;text-align:center;letter-spacing:1px;text-transform:uppercase;border-bottom:0.25rem solid var(--gold-400)}
.action-title{border-top:0.25rem solid var(--gold-400);padding:1rem 0.625rem}
.cbody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:1.125rem 1.375rem;gap:0.875rem}

/* QR */
.qr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.375rem}
.qr-box{background:#fff;border:0.125rem solid var(--line);border-radius:1.5rem;display:flex;flex-direction:column;align-items:center;padding:1.25rem 0.875rem 1rem;gap:0.75rem;box-shadow:0 0.75rem 1.5rem -18px rgba(16,36,58,.6)}
.qr-box img{width:100%;max-width:16.25rem;height:auto;aspect-ratio:1;object-fit:contain;display:block}
.qr-lbl{font:700 1.625rem var(--mont);color:var(--navy-700);text-align:center;letter-spacing:1px;text-transform:uppercase}

/* Layout */
.map-box{position:relative;width:100%;aspect-ratio:194/135;flex:none;background:#5b9bd5;border-radius:1.5rem;overflow:hidden;box-shadow:0 0 0 0.125rem rgba(16,36,58,.12),0 1rem 1.875rem -22px rgba(16,36,58,.7)}
.mz{position:absolute;display:flex;align-items:center;justify-content:center;font:800 1.375rem var(--mont);color:#000;background:#bdbdbd;border:0.25rem solid #f4d03f;border-radius:0.25rem}
.mz.r{background:#e74c3c}.mz.v{background:#27ae60}.mz.s{font-size:1.062rem}
.layout-leg{font-size:1.375rem;font-weight:500;color:var(--ink);line-height:1.6}

/* Seguimiento */
.col3 .cbody{justify-content:flex-start;padding:1.125rem 1.5rem 0;gap:0.625rem}
.badges{display:flex;flex-wrap:wrap;gap:0.4375rem;flex:none}
.badge{font-size:1.188rem;padding:0.25rem 0.8125rem;border-radius:62.44rem;font-weight:700;font-variant-numeric:tabular-nums;border:0.125rem solid transparent}
.bg{background:var(--green-bg);color:#116b3a;border-color:rgba(31,157,87,.35)}
.by{background:var(--amber-bg);color:#7a5600;border-color:rgba(194,138,0,.4)}
.br{background:var(--red-bg);color:#9c231a;border-color:rgba(214,69,58,.4)}
.be{background:var(--ivory-2);color:#aeb5bf;border-color:var(--line);font-weight:600}
#chart{flex:1;min-height:0;position:relative}
#chart svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.tk{font:700 1.25rem "Inter",Arial,sans-serif;fill:var(--muted)}
.hl{font:600 1rem "Inter",Arial,sans-serif;fill:var(--muted);letter-spacing:-.3px}
.pv{font:800 1.562rem var(--mont)}
.legend-row{display:flex;gap:1.875rem;justify-content:center;flex:none;padding:0.25rem 0 0.875rem}
.leg-item{display:flex;align-items:center;gap:0.625rem;font-size:1.375rem;color:var(--ink);font-weight:600}
.leg-dot{width:1.25rem;height:1.25rem;border-radius:0.375rem}
.al{flex:none;margin:0 -24px}
#actionLog{padding:1rem 1.5rem 1.125rem;display:flex;flex-direction:column;gap:0.75rem}
.log-item{font-size:1.562rem;line-height:1.45;padding:1rem 1.625rem;border-radius:1.125rem;border-left:0.5rem solid}
.log-item.prev{background:var(--amber-bg);border-color:var(--amber);color:#6b4a00}
.log-item.react{background:var(--red-bg);border-color:var(--red);color:#8a2018}
.log-item.ok{background:var(--green-bg);border-color:var(--green);color:#115c33}
.log-tag{font-family:var(--mont);font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-right:0.375rem}

/* Celular */
@media (max-width:43.75em){
  body{height:auto;overflow:auto;padding:0.5rem}
  .ws{height:auto;border-radius:1.125rem}
  .main-grid{grid-template-columns:1fr}
  .col{border-right:0;border-bottom:0.125rem solid var(--line)}
  .ws-header{flex-wrap:wrap}.ws-brand{width:100%;justify-content:center}
  .ws-title{font-size:1.25rem;white-space:normal}
  .col3{order:-1}
  #chart{flex:none;height:18.75rem}
}
@media (prefers-reduced-motion:reduce){.live.on{animation:none}}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD9N801JB2TLT7HGNVQfbNuBOJiCeM0mds",
  authDomain: "reempaque-abi.firebaseapp.com",
  projectId: "reempaque-abi",
  storageBucket: "reempaque-abi.firebasestorage.app",
  messagingSenderId: "213854558551",
  appId: "1:213854558551:web:9769b2b7e5246b7f024612"
};
const db = getFirestore(initializeApp(firebaseConfig));
const turnoRef = doc(db, "reempaque", "sorting_turno_actual");

/* Configuración editable */
const META = 16, PREV_MIN = 12;
const HORAS = ['6:00','7:00','8:00','9:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00','23:00'];
const TXT = {
  ok:   ['Meta cumplida:',   'Producción en zona verde. Continuar con el proceso actual.', 'ok'],
  prev: ['Zona Preventiva:', 'Definir acción preventiva para Sorting.', 'prev'],
  rea:  ['Zona Reactiva:',   'Definir acción reactiva para Sorting.', 'react']
};
const zona = v => v >= META ? 'ok' : v >= PREV_MIN ? 'prev' : 'rea';
const $ = id => document.getElementById(id);
let datos = {};

/* El tablero se diseña para 1920x1080 y se escala a la pantalla */
function fit(){
  const narrow = window.innerWidth < 700;
  const s = narrow ? 1 : Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.documentElement.style.fontSize = (16 * s) + 'px';
}

/* Posición vertical (%): las bandas marcan los umbrales reales. 0-12 reactiva, 12-16 preventiva, 16-30 meta */
function yPct(v){
  v = Math.max(0, Math.min(30, v));
  if (v <= 12) return v / 12 * 40;
  if (v <= 16) return 40 + (v - 12) / 4 * 22;
  return 62 + (v - 16) / 14 * 38;
}

function drawBadges(){
  $('hbadges').innerHTML = HORAS.map(h => {
    const v = datos[h];
    if (v === undefined) return `<span class="badge be">${h}</span>`;
    const c = { ok:'bg', prev:'by', rea:'br' }[zona(Number(v))];
    return `<span class="badge ${c}">${h}: ${v}</span>`;
  }).join('');
}

function drawChart(){
  const box = $('chart');
  const W = Math.max(box.clientWidth, 300), H = Math.max(box.clientHeight, 140);
  const k = parseFloat(getComputedStyle(document.documentElement).fontSize) / 16;
  const L = 54 * k, R = 2 * k, T = 42 * k, B = 34 * k;
  const pw = W - L - R, ph = H - T - B, n = HORAS.length;
  const Y = v => T + ph * (1 - yPct(v) / 100);
  const X = i => L + (i + .5) * pw / n;
  let s = `<defs>
    <clipPath id="cp"><rect x="${L}" y="${T}" width="${pw}" height="${ph}" rx="${24*k}"/></clipPath>
    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27ae60"/><stop offset="1" stop-color="#1f9d57"/></linearGradient>
    <linearGradient id="gy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d142"/><stop offset="1" stop-color="#efc21f"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5584d"/><stop offset="1" stop-color="#d6453a"/></linearGradient>
    <filter id="sd" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="${3*k}" stdDeviation="${3*k}" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>`;
  s += `<g clip-path="url(#cp)">
    <rect x="${L}" y="${T}" width="${pw}" height="${Y(META) - T + 1}" fill="url(#gg)"/>
    <rect x="${L}" y="${Y(META)}" width="${pw}" height="${Y(PREV_MIN) - Y(META) + 1}" fill="url(#gy)"/>
    <rect x="${L}" y="${Y(PREV_MIN)}" width="${pw}" height="${T + ph - Y(PREV_MIN)}" fill="url(#gr)"/></g>`;
  s += `<rect x="${L}" y="${T}" width="${pw}" height="${ph}" rx="${24*k}" fill="none" stroke="rgba(16,36,58,.12)" stroke-width="${2*k}"/>`;
  s += `<line x1="${L}" x2="${L + pw}" y1="${Y(META)}" y2="${Y(META)}" stroke="rgba(255,255,255,.9)" stroke-width="${3*k}" stroke-dasharray="${10*k} ${8*k}"/>`;
  [0, 6, 12, 16, 24, 30].forEach(t => { s += `<text class="tk" x="${L - 12 * k}" y="${Y(t) + 7 * k}" text-anchor="end">${t}</text>`; });
  HORAS.forEach((h, i) => { s += `<text class="hl" x="${X(i)}" y="${H - 8 * k}" text-anchor="middle">${h}</text>`; });

  const pts = [];
  HORAS.forEach((h, i) => { if (datos[h] !== undefined) pts.push({ x: X(i), y: Y(Number(datos[h])), v: Number(datos[h]) }); });
  if (pts.length > 1) s += `<polyline points="${pts.map(p => p.x + ',' + p.y).join(' ')}" fill="none" stroke="#0e2236" stroke-width="${5*k}" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    if (last) s += `<circle cx="${p.x}" cy="${p.y}" r="${23*k}" fill="rgba(232,207,138,.6)"/>`;
    s += last
      ? `<circle cx="${p.x}" cy="${p.y}" r="${14*k}" fill="#0e2236" stroke="#d9b45a" stroke-width="${5*k}" filter="url(#sd)"/>`
      : `<circle cx="${p.x}" cy="${p.y}" r="${10*k}" fill="#fff" stroke="#0e2236" stroke-width="${5*k}" filter="url(#sd)"/>`;
    const fs = (last ? 28 : 25) * k, h = fs * 1.5, w = String(p.v).length * fs * .66 + 22 * k;
    let ry = p.y - (last ? 28 : 22) * k - h;
    if (ry < 2 * k) ry = p.y + 20 * k;
    s += `<rect x="${p.x - w / 2}" y="${ry}" width="${w}" height="${h}" rx="${14*k}" fill="${last ? '#0e2236' : '#fff'}" filter="url(#sd)"/>`;
    s += `<text class="pv" x="${p.x}" y="${ry + h * .72}" text-anchor="middle" fill="${last ? '#e8cf8a' : '#0e2236'}" style="font-size:${fs}px">${p.v}</text>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cajas por hora frente a la meta de ${META}">${s}</svg>`;
}

function drawLog(){
  const vals = HORAS.map(h => datos[h]).filter(v => v !== undefined);
  const item = t => `<div class="log-item ${t[2]}"><span class="log-tag">${t[0]}</span> ${t[1]}</div>`;
  if (!vals.length) { $('actionLog').innerHTML = item(TXT.prev) + item(TXT.rea); return; }
  $('actionLog').innerHTML = item(TXT[zona(Number(vals[vals.length - 1]))]);
}

function drawAll(){ drawBadges(); drawLog(); drawChart(); }
function setLive(ok){ $('live').className = 'live ' + (ok ? 'on' : 'off'); }

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { fit(); drawAll(); }, 60); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);

fit(); drawAll();
onSnapshot(turnoRef, snap => {
  datos = snap.exists() ? (snap.data().horas || {}) : {};
  setLive(true); drawAll();
}, err => { console.error(err); setLive(false); });
</script>
</body>
</html>

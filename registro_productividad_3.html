<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e2236">
<title>Registro de Productividad — Reempaque</title>
<style>
:root{
  --navy-900:#0b1b2b; --navy-800:#0e2236; --navy-700:#16324d; --navy-600:#1f4366;
  --gold-300:#e8cf8a; --gold-400:#d9b45a; --gold-500:#c8a03e; --gold-700:#8b6914;
  --ivory:#fbf8f1; --ivory-2:#f3eee2; --line:#e6dfcc;
  --ink:#10243a; --muted:#7a8696;
  --green:#1f9d57; --green-bg:#e6f6ec;
  --amber:#c28a00; --amber-bg:#fff4d6;
  --red:#d6453a; --red-bg:#fde8e6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--navy-900);}
body{
  font-family:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;color:var(--ink);
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(200,160,62,.22), transparent 60%),
    radial-gradient(700px 420px at -10% 110%, rgba(31,67,102,.9), transparent 60%),
    linear-gradient(180deg,var(--navy-800),var(--navy-900));
  display:flex;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));
}
.reg{
  width:100%;max-width:420px;align-self:flex-start;
  background:var(--ivory);border-radius:24px;overflow:hidden;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.65),0 0 0 1px rgba(232,207,138,.35);
}

/* Encabezado */
.reg-header{
  position:relative;overflow:hidden;padding:18px 20px 18px;color:#fff;
  background:linear-gradient(135deg,var(--navy-700) 0%,var(--navy-800) 70%);
  border-bottom:3px solid var(--gold-400);
}
.reg-header::after{
  content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,207,138,.28),transparent 70%);pointer-events:none;
}
.brand-strip{
  display:flex;align-items:center;justify-content:center;gap:20px;
  background:#fff;padding:16px 20px;border-bottom:1px solid var(--line);
}
.brand-strip img{display:block;height:32px;width:auto;}
.brand-strip .sep{width:1px;height:26px;background:var(--line);}
.shift-pill{
  font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
  color:var(--gold-300);border:1px solid rgba(232,207,138,.45);padding:4px 10px;border-radius:999px;
}
.eyebrow-row{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1;}
.reg-eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-300);font-weight:600;}
.reg-title{font-family:"Montserrat","Inter","Segoe UI",system-ui,Arial,sans-serif;font-size:24px;font-weight:800;letter-spacing:.2px;margin-top:4px;position:relative;z-index:1;}

.reg-body{padding:20px 18px 22px;}

/* Métricas */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;}
.mcard{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:12px 8px 10px;text-align:center;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 6px 14px -10px rgba(16,36,58,.35);
}
.mlbl{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.mval{font-family:"Montserrat","Inter","Segoe UI",system-ui,Arial,sans-serif;font-size:28px;font-weight:800;line-height:1.1;color:var(--navy-800);font-variant-numeric:tabular-nums;}

/* Campos */
.field-group{margin-bottom:16px;}
.field-lbl{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--navy-600);margin-bottom:8px;
}
.field-lbl .hint{font-weight:600;letter-spacing:.4px;text-transform:none;color:var(--gold-700);font-size:12px;}
.field-sel,.field-inp{
  width:100%;background:#fff;color:var(--navy-800);outline:none;
  border:1.5px solid var(--line);border-radius:14px;font-weight:700;
  transition:border-color .15s,box-shadow .15s;
}
.field-sel{
  appearance:none;-webkit-appearance:none;font-size:18px;padding:15px 44px 15px 16px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%23c8a03e' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 16px center;
}
.field-inp{font-family:"Montserrat","Inter","Segoe UI",system-ui,Arial,sans-serif;font-size:44px;padding:12px 16px;text-align:center;letter-spacing:1px;font-variant-numeric:tabular-nums;}
.field-inp::placeholder{color:#cfc8b6;}
.field-sel:focus,.field-inp:focus{border-color:var(--gold-400);box-shadow:0 0 0 4px rgba(217,180,90,.25);}

/* Indicador de zona */
.zona-indicator{
  font-family:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;
  min-height:54px;padding:12px 14px;border-radius:14px;margin-bottom:18px;
  font-size:13px;font-weight:700;line-height:1.3;border:1.5px solid transparent;text-wrap:balance;
  transition:background .2s,color .2s,border-color .2s;
}
.zona-indicator::before{content:"";width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:currentColor;}
.zona-vacia{background:var(--ivory-2);color:#a0a8b3;border:1.5px dashed #d8d0bb;font-weight:600;}
.zona-verde{background:var(--green-bg);color:#116b3a;border-color:rgba(31,157,87,.45);}
.zona-amarilla{background:var(--amber-bg);color:#7a5600;border-color:rgba(194,138,0,.5);}
.zona-roja{background:var(--red-bg);color:#9c231a;border-color:rgba(214,69,58,.5);}

/* Botones */
.btn-reg{
  font-family:"Montserrat","Inter","Segoe UI",system-ui,Arial,sans-serif;width:100%;border:none;cursor:pointer;border-radius:16px;padding:18px;
  font-size:16px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--navy-900);
  background:linear-gradient(135deg,var(--gold-300) 0%,var(--gold-400) 55%,var(--gold-500) 100%);
  box-shadow:0 12px 22px -10px rgba(139,105,20,.8),0 1px 0 rgba(255,255,255,.6) inset;
  transition:transform .1s,box-shadow .1s,filter .15s;
}
.btn-reg:hover{filter:brightness(1.04);}
.btn-reg:active{transform:translateY(2px) scale(.99);box-shadow:0 6px 12px -8px rgba(139,105,20,.8);}
.btn-reset{
  display:block;width:max-content;margin:14px auto 0;background:none;border:none;cursor:pointer;
  font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--muted);padding:8px 12px;border-radius:10px;
}
.btn-reset:hover,.btn-reset:active{color:var(--red);background:var(--red-bg);}

/* Historial */
.historial{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);}
.hist-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--navy-600);margin-bottom:10px;}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.badge{
  font-size:13px;font-weight:700;text-align:center;padding:8px 4px;border-radius:12px;
  font-variant-numeric:tabular-nums;border:1px solid transparent;
}
.bg{background:var(--green-bg);color:#116b3a;border-color:rgba(31,157,87,.35);}
.by{background:var(--amber-bg);color:#7a5600;border-color:rgba(194,138,0,.4);}
.br{background:var(--red-bg);color:#9c231a;border-color:rgba(214,69,58,.4);}
.be{background:var(--ivory-2);color:#aeb5bf;border-color:var(--line);font-weight:600;}

@media (max-width:360px){
  .mval{font-size:24px;} .field-inp{font-size:38px;} .reg-title{font-size:21px;}
}
</style>

  </div>
  <header class="reg-header">
    <div class="eyebrow-row">
      <div class="reg-eyebrow">Registro por hora</div>
      <div class="shift-pill">Turno activo</div>
    </div>
    <h1 class="reg-title">Operador de Reempaque</h1>
  </header>

  <div class="reg-body">
    <section class="metrics" aria-label="Resumen del turno">
      <div class="mcard"><div class="mlbl">Última hora</div><div class="mval" id="mActual">—</div></div>
      <div class="mcard"><div class="mlbl">Promedio</div><div class="mval" id="mProm">—</div></div>
      <div class="mcard"><div class="mlbl">Cumpl.</div><div class="mval" id="mCump" style="color:#1f9d57;">—</div></div>
    </section>

    <div class="field-group">
      <label class="field-lbl" for="horaInp"><span>Hora del turno</span></label>
      <select class="field-sel" id="horaInp"></select>
    </div>

    <div class="field-group">
      <label class="field-lbl" for="cajasInp"><span>Cajas producidas</span><span class="hint">Meta: 16 CA/H</span></label>
      <input class="field-inp" id="cajasInp" type="number" min="0" max="99" placeholder="0" inputmode="numeric">
    </div>

    <div class="zona-indicator zona-vacia" id="zonaPreview">Ingresa las cajas para ver la zona</div>

    <button class="btn-reg" onclick="registrar()">Registrar</button>
    <button class="btn-reset" onclick="resetDatos()">Reiniciar turno</button>

    <section class="historial">
      <div class="hist-title">Historial del turno</div>
      <div class="badges" id="badges"></div>
    </section>
  </div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD9N801JB2TLT7HGNVQfbNuBOJiCeM0mds",
  authDomain: "reempaque-abi.firebaseapp.com",
  projectId: "reempaque-abi",
  storageBucket: "reempaque-abi.firebasestorage.app",
  messagingSenderId: "213854558551",
  appId: "1:213854558551:web:9769b2b7e5246b7f024612"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const turnoRef = doc(db, "reempaque", "turno_actual");

const META=16,PREV_MIN=12;
const HORAS=['6:00','7:00','8:00','9:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00','23:00'];
let datos={};

const sel=document.getElementById('horaInp');
HORAS.forEach(h=>{const o=document.createElement('option');o.value=h;o.textContent=h;sel.appendChild(o);});
sel.selectedIndex=Math.max(0,Math.min(new Date().getHours()-6,HORAS.length-1));

onSnapshot(turnoRef, (snap) => {
  datos = snap.exists() ? (snap.data().horas || {}) : {};
  drawBadges(); drawMetrics();
});

function colorFor(v){if(v>=META)return '#27ae60';if(v>=PREV_MIN)return '#c9a800';return '#e74c3c';}
function updatePreview(){
  const v=parseInt(document.getElementById('cajasInp').value);
  const el=document.getElementById('zonaPreview');
  if(isNaN(v)||v<0){el.className='zona-indicator zona-vacia';el.textContent='Ingresa las cajas para ver la zona';return;}
  if(v>=META){el.className='zona-indicator zona-verde';el.textContent='Zona Verde — Meta cumplida ('+v+' CA/H)';}
  else if(v>=PREV_MIN){el.className='zona-indicator zona-amarilla';el.textContent='Zona Preventiva — Por debajo de meta ('+v+' CA/H)';}
  else{el.className='zona-indicator zona-roja';el.textContent='Zona Reactiva — Requiere acción ('+v+' CA/H)';}
}
document.getElementById('cajasInp').addEventListener('input',updatePreview);
function drawBadges(){
  const c=document.getElementById('badges');c.innerHTML='';
  HORAS.forEach(h=>{
    const v=datos[h];const b=document.createElement('span');
    if(v===undefined){b.className='badge be';b.textContent=h;}
    else if(v>=META){b.className='badge bg';b.textContent=h+': '+v;}
    else if(v>=PREV_MIN){b.className='badge by';b.textContent=h+': '+v;}
    else{b.className='badge br';b.textContent=h+': '+v;}
    c.appendChild(b);
  });
}
function drawMetrics(){
  const vals=HORAS.map(h=>datos[h]).filter(v=>v!==undefined);
  const ult=vals.length?vals[vals.length-1]:null;
  const prom=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;
  const cump=vals.length?Math.round(vals.filter(v=>v>=META).length/vals.length*100):null;
  const ea=document.getElementById('mActual');
  ea.textContent=ult!==null?ult:'—';ea.style.color=ult===null?'#1a3a5c':colorFor(ult);
  document.getElementById('mProm').textContent=prom!==null?prom:'—';
  const ec=document.getElementById('mCump');
  ec.textContent=cump!==null?cump+'%':'—';
  ec.style.color=cump===null?'#27ae60':cump>=80?'#27ae60':cump>=50?'#c9a800':'#e74c3c';
}
window.registrar = async function(){
  const v=parseInt(document.getElementById('cajasInp').value);
  const h=document.getElementById('horaInp').value;
  if(isNaN(v)||v<0||v>99){alert('Ingresa un número válido (0-99).');return;}
  datos[h]=v;
  await setDoc(turnoRef, { horas: datos }, { merge: true });
  document.getElementById('cajasInp').value='';
  document.getElementById('zonaPreview').className='zona-indicator zona-vacia';
  document.getElementById('zonaPreview').textContent='Ingresa las cajas para ver la zona';
  document.getElementById('horaInp').selectedIndex=Math.min(HORAS.indexOf(h)+1,HORAS.length-1);
}
window.resetDatos = async function(){
  if(!confirm('¿Reiniciar todos los datos del turno?'))return;
  datos={};
  await setDoc(turnoRef, { horas: {} });
}
document.getElementById('cajasInp').addEventListener('keydown',e=>{if(e.key==='Enter')registrar();});
</script>
</body>
</html>
